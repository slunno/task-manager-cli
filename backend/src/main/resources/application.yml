spring:
  application:
    name: helpdesk
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:1025}
  servlet:
    multipart:
      max-file-size: ${HELPDESK_MAX_ATTACHMENT_SIZE:10MB}
      max-request-size: ${HELPDESK_MAX_ATTACHMENT_SIZE:10MB}
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
