spring:
  application:
    name: helpdesk
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: ${HELPDESK_MAX_ATTACHMENT_SIZE:10MB}
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
helpdesk:
  storage:
    mode: ${HELPDESK_STORAGE_MODE:local}
    local-directory: ${HELPDESK_STORAGE_LOCAL_DIRECTORY:./data/anexos}
    s3:
      endpoint: ${HELPDESK_S3_ENDPOINT:}
      access-key: ${HELPDESK_S3_ACCESS_KEY:}
      secret-key: ${HELPDESK_S3_SECRET_KEY:}
      bucket: ${HELPDESK_S3_BUCKET:}
  auth:
    mode: disabled
  mail:
    from: ${HELPDESK_MAIL_FROM:helpdesk@localhost}
    ti:
      mode: ${HELPDESK_MAIL_TI_MODE:usuarios}
      addresses: ${HELPDESK_MAIL_TI_ADDRESSES:}
  portal:
    url: ${HELPDESK_PORTAL_URL:http://127.0.0.1:5173}
  conclusao:
    dias-reabertura: ${HELPDESK_REOPEN_DAYS:7}
    dias-fechamento: ${HELPDESK_AUTOCLOSE_DAYS:3}
  retencao:
    enabled: ${HELPDESK_RETENTION_ENABLED:true}
    anos: ${HELPDESK_RETENTION_YEARS:3}
