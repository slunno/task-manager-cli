# Combine com dev,supabase localmente ou prod,supabase em producao.
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SUPABASE_DB_JDBC_URL:jdbc:postgresql://db.evsmgbziifqbyahvcwsc.supabase.co:5432/postgres?sslmode=require&currentSchema=helpdesk}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      schema: helpdesk
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    properties:
      hibernate:
        default_schema: helpdesk
  flyway:
    default-schema: helpdesk
    schemas: helpdesk
    baseline-on-migrate: false
    clean-disabled: true
