spring:
  config:
    activate:
      on-profile: prod
  mail:
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
  security:
    oauth2:
      client:
        provider:
          corporativo:
            issuer-uri: ${OIDC_ISSUER_URI}
        registration:
          corporativo:
            provider: corporativo
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${OIDC_REDIRECT_URI}
            scope: openid,profile,email
server:
  servlet:
    session:
      cookie:
        secure: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
helpdesk:
  storage:
    mode: s3
  auth:
    mode: oidc
    allowed-email-domain: ${OIDC_ALLOWED_EMAIL_DOMAIN}

logging:
  structured:
    format:
      console: ecs

