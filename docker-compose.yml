services:
  postgres:
    image: postgres:16.15-alpine3.23
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: ${HELPDESK_DB_USER:?Defina HELPDESK_DB_USER}
      POSTGRES_PASSWORD: ${HELPDESK_DB_PASSWORD:?Defina HELPDESK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HELPDESK_DB_USER} -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/api/v2/messages"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/helpdesk
      DATABASE_USER: ${HELPDESK_DB_USER}
      DATABASE_PASSWORD: ${HELPDESK_DB_PASSWORD}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      HELPDESK_PORTAL_URL: http://localhost:3000
      HELPDESK_STORAGE_MODE: local
      HELPDESK_STORAGE_LOCAL_DIRECTORY: /app/data/anexos
    volumes:
      - attachments_data:/app/data/anexos
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:8080"

volumes:
  postgres_data:
  minio_data:
  attachments_data:
