name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testes, pacote e formatação
        working-directory: backend
        run: ./mvnw -B verify
      - name: Contrato OpenAPI sincronizado
        run: node .github/scripts/check-openapi.mjs
      - name: Dependências declaradas
        working-directory: backend
        run: ./mvnw -B dependency:analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/generated.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HELPDESK_DB_USER: helpdesk_e2e
      HELPDESK_DB_PASSWORD: ficticio_descartavel_e2e
      MINIO_ROOT_USER: minio_e2e
      MINIO_ROOT_PASSWORD: ficticio_minio_descartavel
      COMPOSE_PROJECT_NAME: helpdesk-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Subir Compose dev com API e banco reais
        run: docker compose up -d --build postgres mailhog backend frontend
      - run: node .github/scripts/wait-compose.mjs
      - name: Confirmar execução sem root
        run: |
          test "$(docker compose exec -T backend id -u)" -ne 0
          test "$(docker compose exec -T frontend id -u)" -ne 0
      - name: Preparar agente fictício de TI
        run: docker compose exec -T postgres psql -U "$HELPDESK_DB_USER" -d helpdesk -v ON_ERROR_STOP=1 < frontend/e2e/seed.sql
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Logs dos serviços em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=150 backend frontend postgres
      - name: Encerrar ambiente descartável
        if: always()
        run: docker compose down -v
