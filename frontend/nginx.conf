map $scheme $helpdesk_hsts {
  default "";
  https "max-age=31536000";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # O proxy emite uma única cópia também nas respostas do backend.
  proxy_hide_header X-Content-Type-Options;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security $helpdesk_hsts always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  location /oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  location /login/oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  location = /actuator/health {
    proxy_pass http://backend:8080;
  }

  location ^~ /actuator/health/ {
    proxy_pass http://backend:8080;
  }

  # Nao encaminhar observabilidade e documentacao, nem cair no fallback da SPA.
  location = /actuator { return 404; }
  location ^~ /actuator/ { return 404; }
  location /v3/api-docs { return 404; }
  location /swagger-ui { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
